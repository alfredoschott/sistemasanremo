<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3d27" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SRM Telsa" />
    <title>SRM Telsa Transformadores</title>
  </head>
  <body>
    <!-- Relleno fijo del área segura de arriba (debajo de la barra de
         estado de iOS: reloj/wifi/batería, eso lo pinta el sistema y no
         se puede tocar). Sin esto, si el header de la app no calza
         pixel-perfecto con esa área en cada combinación de dispositivo/
         orientación, se alcanza a ver el fondo claro de la página como
         una franja blanca — este div va siempre encima, del mismo verde
         del header, así que esa franja nunca se nota. -->
    <div id="safe-area-fill"></div>
    <div id="root"></div>
    <!-- iOS no deja bloquear la rotación desde la web (eso solo lo puede
         hacer una app nativa) — como alternativa, se tapa la pantalla
         pidiendo girar a vertical, pero solo en tamaño de teléfono
         (alto de pantalla chico). En iPad, con mucho más alto disponible
         incluso en horizontal, este aviso nunca aparece. Ver reglas en
         src/index.css (#rotate-guard). -->
    <div id="rotate-guard">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="7" y="2" width="10" height="16" rx="2" />
        <path d="M12 22a4 4 0 0 0 4-4h-8a4 4 0 0 0 4 4Z" />
        <path d="m20 9 2 2-2 2M22 11h-5" />
      </svg>
      <p>Gira tu teléfono a vertical<br />para usar SRM Telsa</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
